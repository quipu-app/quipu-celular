<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quipu</title>
  <link rel="stylesheet" href="estilos.css">
  <link rel="stylesheet" href="funciones/funciones.css">
  <link rel="stylesheet" href="funciones/tiempo.css"><link rel="stylesheet" href="funciones/notas.css"><link rel="stylesheet" href="funciones/foco.css"><link rel="stylesheet" href="funciones/agenda.css"><link rel="stylesheet" href="funciones/sonidos.css"><link rel="stylesheet" href="funciones/ajustes.css"><link rel="stylesheet" href="funciones/colores.css">
</head>
<body>
  <main id="aparato" class="cerrado" data-modo="inicio">
    <img id="imagen-abierta" alt="">
    <div id="lente"></div>

    <div id="pantalla">
      <section id="inicio">
        <div id="globo" aria-live="polite"></div>
        <button id="personaje" class="figura" aria-label="Tocá al personaje"></button>
      </section>
      <section id="funcion">
        <header>
          <button id="volver" aria-label="Volver al inicio">‹</button>
          <h1 id="funcion-titulo"></h1>
          <button id="funcion-opciones" aria-label="Opciones" hidden>⋯</button>
        </header>
        <div id="funcion-contenido" class="desplazable"></div>
      </section>
    </div>

    <button id="cerrar" aria-label="Cerrar Quipu"></button>

    <div id="pantallita">
      <button id="mini" class="figura" aria-label="Tocá al personaje"></button>
      <div id="cartel" aria-live="polite"><span id="cartel-texto"></span></div>
    </div>

    <button class="tecla" id="t-foco" data-funcion="foco" aria-label="Foco"></button>
    <button class="tecla" id="t-notas" data-funcion="notas" aria-label="Notas"></button>
    <button class="tecla" id="t-agenda" data-funcion="agenda" aria-label="Agenda"></button>
    <button class="tecla" id="t-tiempo" data-funcion="tiempo" aria-label="Tiempo"></button>
    <button class="tecla" id="t-sonidos" data-funcion="sonidos" aria-label="Sonidos"></button>
    <button class="tecla" id="t-ajustes" data-funcion="ajustes" aria-label="Ajustes"></button>

    <button id="tapa" aria-label="Abrir Quipu"><img id="imagen-cerrada" alt=""></button>
  </main>
  <script src="personaje.js"></script>
  <script src="funciones/tiempo.js"></script><script src="lib/qrcode.js"></script><script src="funciones/notas.js"></script><script src="funciones/foco.js"></script><script src="funciones/agenda.js"></script><script src="funciones/sonidos.js"></script><script src="funciones/ajustes.js"></script>
  <script src="funciones/arrastre.js"></script><script src="quipu.js"></script>
</body>
</html>
